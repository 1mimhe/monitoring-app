<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin panel — manage and monitor connected agents." />
  <title>Monitoring App — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-page">
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon admin-icon">🛡️</div>
        <h1 class="auth-title">Admin Panel</h1>
        <p class="auth-subtitle">Monitor and manage all agents in a room</p>
      </div>

      <form class="auth-form" action="/chat.html">
        <input type="hidden" name="pcName" value="Admin" />
        <input type="hidden" name="role"   value="admin" />

        <div class="field-group">
          <label class="field-label" for="room">Room</label>
          <input
            id="room"
            class="field-input"
            type="text"
            name="room"
            placeholder="Room name"
            value="Default"
            required
          />
        </div>

        <button type="submit" class="auth-btn admin-btn">
          <span>Enter as Admin</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <p class="auth-footer-link">
        Not an admin?
        <a href="/">Join as Agent →</a>
      </p>
    </div>
  </main>
</body>
</html>
