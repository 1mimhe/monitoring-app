<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Join a monitoring room as an agent." />
  <title>Monitoring App — Join Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-page">
  <!-- Animated background orbs -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">📡</div>
        <h1 class="auth-title">Join Room</h1>
        <p class="auth-subtitle">Connect as an agent to be monitored</p>
      </div>

      <form class="auth-form" action="/chat.html">
        <input type="hidden" name="role" value="user" />

        <div class="field-group">
          <label class="field-label" for="pcName">PC Name</label>
          <input
            id="pcName"
            class="field-input"
            type="text"
            name="pcName"
            placeholder="e.g. DESKTOP-001"
            autocomplete="off"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="room">Room</label>
          <input
            id="room"
            class="field-input"
            type="text"
            name="room"
            placeholder="Room name"
            value="Default"
            required
          />
        </div>

        <button type="submit" class="auth-btn">
          <span>Join as Agent</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <p class="auth-footer-link">
        Are you an admin?
        <a href="/admin.html">Admin panel →</a>
      </p>
    </div>
  </main>
</body>
</html>
